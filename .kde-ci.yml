Dependencies:
  - 'on': ['@all']
    'require':
      'frameworks/kbookmarks': 'Frameworks/6.24'
      'frameworks/threadweaver': 'Frameworks/6.24'
      'frameworks/kcolorscheme': 'Frameworks/6.24'
      'frameworks/ki18n': 'Frameworks/6.24'
      'frameworks/kio': 'Frameworks/6.24'
      'frameworks/karchive': 'Frameworks/6.24'
      'frameworks/kparts': 'Frameworks/6.24'
      'frameworks/ktextwidgets': 'Frameworks/6.24'
      'frameworks/kwidgetsaddons': 'Frameworks/6.24'
      'frameworks/kxmlgui': 'Frameworks/6.24'
      'graphics/kdegraphics-mobipocket': '@same'

  - 'on': ['Linux', 'FreeBSD', 'Windows']
    'require':
      'frameworks/purpose': 'Frameworks/6.24'
      'frameworks/breeze-icons': 'Frameworks/6.24'
      'graphics/libkexiv2': '@same'

  - 'on': ['Android']
    'require':
      'frameworks/kirigami': 'Frameworks/6.24'

Options:
  require-passing-tests-on: ['Linux', 'FreeBSD']
  per-test-timeout: 300
  cppcheck-arguments:
    - '--enable=warning,style,performance'
    - '--library=okular-cppcheck.xml'
    - '--suppress-xml=cppcheck-suppressions.xml'
  cppcheck-ignore-files:
    - autotests
    - core/synctex/synctex_parser.c
    - core/synctex/synctex_parser_utils.c
  xml-validate-include:
    - shell/shell.rc
    - part/part-viewermode.rc
    - part/part.rc
